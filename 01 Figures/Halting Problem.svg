<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="986" height="536" viewBox="0 0 986 536" role="img" aria-labelledby="title desc" stroke="#04B367">
  <title id="title">Halting problem self-reference diagram</title>
  <desc id="desc">A program P is supplied to machine H inside machine D. If H returns false, D returns true. If H returns true, D loops forever.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#04B367"/>
    </marker>
    <style>
      .outline { fill: none; stroke: #04B367; stroke-width: 2; }
      .wire { fill: none; stroke: #04B367; stroke-width: 2; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #04B367; stroke-width: 2; marker-end: url(#arrow); }
      .math { font-family: "Times New Roman", Times, serif; font-style: italic; fill: #04B367; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #04B367; }
    </style>
  </defs>

  <!-- Outer system boundary
  <rect x="102" y="38" width="800" height="480" fill="none" stroke="#04B367" stroke-width="2"/>  -->

  <!-- D container -->
  <rect x="202" y="118" width="540" height="360" rx="18" ry="18" fill="none" stroke="#04B367" stroke-width="2"/>
  <text x="472" y="108" class="math" font-size="44" text-anchor="middle">D</text>

  <!-- H block -->
  <rect x="322" y="198" width="160" height="240" rx="9" ry="9" fill="none" stroke="#04B367" stroke-width="2"/>
  <text x="402" y="189" class="math" font-size="44" text-anchor="middle">H</text>

  <!-- Input P and duplicated inputs to H -->
  <text x="164" y="323" class="math" font-size="42" text-anchor="end">P</text>
  <path d="M170 313 H242" class="wire"/>
  <path d="M242 313 V274 H320" class="arrow"/>
  <path d="M242 313 V354 H320" class="arrow"/>

  <!-- False branch -->
  <path d="M483 248 H800" class="arrow"/>
  <text x="498" y="237" class="label" font-size="34">False</text>
  <text x="808" y="258" class="label" font-size="34">True</text>

  <!-- True branch -->
  <path d="M483 378 H600" class="arrow"/>
  <text x="498" y="369" class="label" font-size="34">True</text>

  <!-- Loop forever block -->
  <rect x="602" y="338" width="96" height="81" rx="5" ry="5" fill="none" stroke="#04B367" stroke-width="2"/>
  <text x="650" y="367" class="label" font-size="24" text-anchor="middle">Loop</text>
  <text x="650" y="397" class="label" font-size="24" text-anchor="middle">forever</text>
</svg>
